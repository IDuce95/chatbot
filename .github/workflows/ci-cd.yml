name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: black --check app/ tests/

    - name: Check imports with isort
      continue-on-error: true
      run: isort --check-only app/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Create test environment file
      run: |
        echo "OPENAI_API_KEY=test-key" > .env
        echo "LANGCHAIN_API_KEY=test-key" >> .env
        echo "LANGCHAIN_TRACING_V2=false" >> .env

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  docker-test:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Docker image
      run: |
        docker build -f Dockerfile.api -t chatbot-api:test .

    - name: Build Streamlit Docker image
      run: |
        docker build -f Dockerfile.streamlit -t chatbot-streamlit:test .

    - name: Test Docker containers
      run: |
        echo "OPENAI_API_KEY=test-key" > .env.test
        echo "LANGCHAIN_API_KEY=test-key" >> .env.test
        echo "LANGCHAIN_TRACING_V2=false" >> .env.test

        # Test API container
        docker run --rm -d --name test-api -p 8001:8000 --env-file .env.test chatbot-api:test

        # Wait for API container to become healthy (max 30s)
        for i in {1..30}; do
          if curl -fs http://localhost:8001/health; then
            echo "API is healthy!"
            break
          fi
          echo "Waiting for API to become healthy... ($i/30)"
          sleep 1
        done
        # Fail if not healthy after 30s
        if ! curl -fs http://localhost:8001/health; then
          echo "API did not become healthy in time."
          docker logs test-api
          docker stop test-api
          exit 1
        fi

        # Stop container
        docker stop test-api

        echo "Docker tests passed!"